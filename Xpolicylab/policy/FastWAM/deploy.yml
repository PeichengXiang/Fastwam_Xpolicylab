policy_name: FastWAM
protocol: ws
eval_batch: true

# Server transport: overridden by setup_eval_policy_server.sh per launch.
# Keys are `port` / `host` because XPolicyLab/setup_policy_server.py reads
# those names (deploy_cfg.get("port") / deploy_cfg.get("host")).
port: null
host: localhost

# Identifiers + per-launch wiring (set via --overrides from the eval scripts).
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
action_type: joint
action_dim: null
seed: null
gpu_id: null

# Policy artefacts: resolved in setup_eval_policy_server.sh from ckpt_name.
checkpoint_path: null
dataset_stats_path: null
checkpoint_root: null
checkpoint_num: null
joint_only: true

# FastWAM upstream policy hyperparameters.
sim_cfg_name: sim_robotwin.yaml
# SParkArena keeps its existing recipe. EgoVLA automatically loads the saved
# checkpoint config + fastwam_inference_contract.json; this default cannot
# override the EgoVLA model, image size, normalization, or task camera sources.
sim_task: bench_v5_joint54_0908-real
device: cuda
mixed_precision: bf16
# null -> upstream default (num_frames - 1, typically 32 for robotwin).
action_horizon: null
replan_steps: 24
num_inference_steps: 10
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
timing_enabled: false
default_instruction: follow the instruction
allow_dummy_policy: false

# Websocket tuning.  FastWAM loads a multi-billion-parameter backbone, so the
# server may need longer than the generic XPolicyLab request timeout during a
# first inference.  These remain overrideable per launch.
request_timeout_s: 300.0
connect_timeout_s: 30.0
handshake_timeout_s: 120.0
max_connect_attempts: 30
connect_retry_delay_s: 2.0
max_connect_seconds: 600.0
close_timeout_s: 20.0

# Optional roots used by split-workspace evaluation.  The model-side adapter
# still receives the normal XPolicyLab action/observation contract.
env_cfg_root: null
model_base_path: null
